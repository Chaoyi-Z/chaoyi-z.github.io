<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MarmoFACT HR</title>
<style>
  :root{--bg:#14171a;--card:#1c211f;--line:#333a35;--ink:#ede7d8;--dim:#9ca39a;--accent:#5c9a86;--warn:#e3a574;}
  @media (prefers-color-scheme: light){
    :root{--bg:#f4efe3;--card:#ffffff;--line:#d8d0bd;--ink:#262420;--dim:#6f675e;--accent:#2f7a63;--warn:#a8551c;}
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;}
  .gate{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:32px 28px;}
  .lock{width:40px;height:40px;color:var(--accent);margin-bottom:14px;}
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;}
  h1{font-size:22px;margin:0 0 10px;text-wrap:balance;}
  p{margin:0 0 18px;color:var(--dim);font-size:14.5px;}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;}
  .row{display:flex;gap:8px;}
  input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:0;background:var(--accent);color:#fff;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  .msg{min-height:22px;margin:10px 0 0;font-size:13.5px;color:var(--warn);}
  .msg.busy{color:var(--dim);}
  .ask{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:14px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<main class="gate">
  <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
  <p class="kicker">Access code required</p>
  <h1>MarmoFACT HR</h1>
  <p>This page is shared on request. Enter the access code to open it.</p>
  <form id="f" autocomplete="off">
    <label for="code">Access code</label>
    <div class="row">
      <input id="code" type="password" required autofocus>
      <button id="go" type="submit">Unlock</button>
    </div>
    <div id="msg" class="msg" role="status"></div>
  </form>
  <p class="ask">No code? Email <a href="mailto:zhangcy@mit.edu?subject=Access%20request%3A%20MarmoFACT%20HR">zhangcy@mit.edu</a> to request access.</p>
</main>
<script>
(function () {
  var SALT = "LZgWWGVSuUgDOGVGkoK0rw==", ITER = 600000, STORE = "locked-pages-code";
  var TYPES = { glb: "model/gltf-binary", js: "text/javascript", css: "text/css", png: "image/png", jpg: "image/jpeg",
    jpeg: "image/jpeg", gif: "image/gif", svg: "image/svg+xml", webp: "image/webp", json: "application/json",
    mp4: "video/mp4", pdf: "application/pdf", html: "text/html" };
  var form = document.getElementById("f"), input = document.getElementById("code"),
      btn = document.getElementById("go"), msg = document.getElementById("msg");

  function say(text, busy) { msg.textContent = text; msg.className = busy ? "msg busy" : "msg"; }
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

  function deriveKey(code) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(code.normalize("NFKC")), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      });
  }
  function open(key, url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("load");
      return r.arrayBuffer();
    }).then(function (buf) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
    });
  }

  function unlock(code, quiet) {
    btn.disabled = true;
    say("Checking…", true);
    var key;
    return deriveKey(code).then(function (k) {
      key = k;
      return open(key, "page.enc").catch(function (e) { throw new Error(e.message === "load" ? "load" : "wrong"); });
    }).then(function (buf) {
      try { sessionStorage.setItem(STORE, code); } catch (e) {}
      var page = JSON.parse(new TextDecoder().decode(buf)), html = page.html, done = 0;
      say("Opening…", true);
      return Promise.all(page.assets.map(function (path) {
        return open(key, path + ".enc").then(function (data) {
          var type = TYPES[path.split(".").pop().toLowerCase()] || "application/octet-stream";
          var url = URL.createObjectURL(new Blob([data], { type: type }));
          html = html.split('"' + path + '"').join('"' + url + '"').split("'" + path + "'").join("'" + url + "'");
          say("Opening… " + (++done) + " / " + page.assets.length, true);
        });
      })).then(function () {
        document.open();
        document.write(html);
        document.close();
      });
    }).catch(function (e) {
      btn.disabled = false;
      if (e.message === "wrong") {
        try { sessionStorage.removeItem(STORE); } catch (x) {}
        say(quiet ? "" : "That code is not right. Check it and try again.");
        input.select();
      } else {
        say("The page could not be loaded. Check your connection and try again.");
      }
    });
  }

  if (!window.crypto || !crypto.subtle) {
    say("This page needs a secure (https) connection and a current browser.");
    btn.disabled = true;
    return;
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); if (input.value) unlock(input.value, false); });
  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
