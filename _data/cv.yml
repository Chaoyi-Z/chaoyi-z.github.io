- title: Research Interests
  type: list
  contents:
    - <strong>Psychiatric disease.</strong> What circuit-level dysfunction gives rise to psychiatric disorders — and can we see it in a primate brain?
    - <strong>The social brain.</strong> How do primates compute social behavior and emotion, and what happens when those circuits go wrong?
    - <strong>4D systems neuroscience.</strong> Brain-wide, volume by volume, moment by moment — how do whole-brain dynamics give rise to behavior?
    - <strong>Ultrasound as neurotechnology.</strong> Functional ultrasound imaging fills the missing scale between electrodes and fMRI. I build the tools as much as I use them.
    - <strong>The evolution of intelligence.</strong> What does comparing brains across species tell us about how natural intelligence was built?

